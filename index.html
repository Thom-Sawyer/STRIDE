<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STRIDE – STI Sta. Maria Disciplinary Office Logbook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">STRIDE</span><div><h1>STI College Sta. Maria – Disciplinary Office Logbook</h1><small>Student discipline records &amp; proof files</small></div></div>
  <div class="stats"><span id="stA"></span><span id="stB"></span></div>
</header>

<main>
  <section class="card" id="entry">
    <h2>New log entry</h2>
    <label>Student ID</label><input id="fId" inputmode="numeric" autocomplete="off" placeholder="e.g. 02000123456">
    <label>Student name</label><input id="fName" placeholder="Last name, First name">
    <div class="row2">
      <div><label>Section <button class="mini" type="button" data-manage="sec">Edit list</button></label><select id="fSec"></select></div>
      <div><label>Date</label><input type="date" id="fDate"></div>
    </div>
    <label>Offense <button class="mini" type="button" data-manage="off">Edit list</button></label><select id="fOff"></select>
    <label>Notes</label>
    <textarea id="fNotes" placeholder="Details, action taken…"></textarea>
    <button class="p" id="add">Add to logbook</button>
  </section>

  <section class="card" id="records">
    <h2>Records</h2>
    <div class="tabs" id="recTabs"><button data-rv="active" class="on">Active</button><button data-rv="archived">Archived</button></div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search student ID or name…">
      <select id="fltSec"></select>
      <select id="fltOff"></select>
    </div>
    <div class="list" id="list"></div>
  </section>

  <aside class="card" id="proofCard">
    <h2>Proof of offense</h2>
    <div class="body">
      <div id="side"></div>
      <div id="pside"></div>
    </div>
  </aside>
</main>

<div id="ddp"></div>
<div id="mng"><div class="box"><h2 id="mngTitle"></h2><div id="mngList"></div><div id="lvBox"></div><div class="row" style="margin-top:10px"><input id="mngIn" placeholder="New item…"><select id="mngLv"></select><button class="p" id="mngAdd" type="button" style="flex:0 0 auto">Add</button></div><p style="margin:12px 0 0"><button id="mngDone" type="button" style="width:100%">Done</button></p></div></div>
<div id="dlg"><div class="box"><p id="dlgMsg"></p><div class="acts"><button id="dlgNo">Cancel</button><button class="d" id="dlgYes">Remove</button></div></div></div>
<div id="lb"><img alt="Proof"></div>
<script src="script.js"></script>
</body>
</html>
